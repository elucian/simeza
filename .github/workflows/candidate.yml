name: Build Candidate
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "candidate"
  cancel-in-progress: true

jobs:
  build-candidate:
    if: !startsWith(github.event.head_commit.message, 'Publish release:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown Pillow

      - name: Build static site (Candidate)
        run: |
          python script/build.py
          echo "Candidate build successful."
