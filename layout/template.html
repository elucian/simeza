<!DOCTYPE html>
<html class="notranslate" lang="{{lang}}">
<head>
  <meta name="google" content="notranslate">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="page-id" content="{{page-id}}">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{keywords}}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/core/css/style.css?v={{version}}">
  {{page-css}}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="icon" type="image/svg+xml" href="/core/img/favicon.svg">
</head>
<body data-page="{{page-id}}">

<div class="container"> 
<header class="header-app">
  <img src="/core/img/simeza-logo-w.svg" id="themeLogo" alt="Logo" class="logo-btn" onclick="toggleTheme()">
  
  <nav class="desktop-nav">
    <ul id="menuList" class="nav-menu">
      {{menu}}
    </ul>
  </nav>

  <div class="header-actions">
    <button id="filterBtn" class="filter-btn" title="Filter" onclick="toggleFilterModal()">
      <i id="filterIcon" class="bi bi-funnel"></i>
    </button>
    <div class="lang-selector">
      <button id="langBtn" onclick="toggleLangMenu()"></button>
      <ul id="langMenu" class="lang-menu"></ul>
    </div>
    <button class="navbar-toggler" type="button" onclick="toggleMobileMenu()">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>

<nav id="mobileMenu">
  <ul id="mobileMenuList">
    {{mobile_menu}}
  </ul>
</nav>

<main id="content" class="content">
   {{page-content}}
</main>

<footer id="socialFooter"></footer>
</div>

<script src="/core/js/simeza.js"></script>
{{page-js}}

</body>
</html>
