<!DOCTYPE html>
<html class="notranslate" lang="es">
<head>
  <meta name="google" content="notranslate">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Simeza</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/core/css/style.css?v={{version}}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>

<div class="container"> 
<header class="header-app">
  <img src="/core/img/sage-logo-w.svg" id="themeLogo" alt="Logo" class="logo-btn" onclick="toggleTheme()">
  
  <nav class="desktop-nav">
    <ul id="menuList" class="nav-menu">
      {{menu}}
    </ul>
  </nav>

  <div class="header-actions">
    <div class="lang-selector">
      <button id="langBtn" style="border:none; background:none; cursor:pointer;" onclick="toggleLangMenu()"></button>
      <ul id="langMenu" class="lang-menu"></ul>
    </div>
    <button class="navbar-toggler" type="button" onclick="toggleMobileMenu()">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>

<nav id="mobileMenu">
  <ul id="mobileMenuList" style="list-style:none; padding:0;">
    {{mobile_menu}}
  </ul>
</nav>

<main id="content">
   {{page-content}}
</main>

<footer id="socialFooter"></footer>
</div>

<script src="/core/js/simeza.js"></script>

</body>
</html>
