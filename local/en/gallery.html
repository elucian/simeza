<!DOCTYPE html>
<html class="notranslate" lang="en">
<head>
  <meta name="google" content="notranslate">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Simeza Art</title>
  <meta name="description" content="A curated collection of photographic works and paintings from Simeza Art gallery.">
  <meta name="keywords" content="simeza, art, gallery, paintings, pictures, photography, fine art">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/core/css/style.css?v=">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="icon" type="image/svg+xml" href="/core/img/favicon.svg">
</head>
<body>

<div class="container"> 
<header class="header-app">
  <img src="/core/img/simeza-logo-w.svg" id="themeLogo" alt="Logo" class="logo-btn" onclick="toggleTheme()">
  
  <nav class="desktop-nav">
    <ul id="menuList" class="nav-menu">
      <li class="nav-item"><a class="nav-link" href="/en/gallery.html">Gallery</a></li><li class="nav-item"><a class="nav-link" href="/en/events.html">Events</a></li><li class="nav-item"><a class="nav-link" href="/en/authors.html">Authors</a></li><li class="nav-item"><a class="nav-link" href="/en/writings.html">Writings</a></li><li class="nav-item"><a class="nav-link" href="/en/books.html">Books</a></li><li class="nav-item"><a class="nav-link" href="/en/index.html#about">About</a></li>
    </ul>
  </nav>

  <div class="header-actions">
    <div class="lang-selector">
      <button id="langBtn" style="border:none; background:none; cursor:pointer;" onclick="toggleLangMenu()"></button>
      <ul id="langMenu" class="lang-menu"></ul>
    </div>
    <button class="navbar-toggler" type="button" onclick="toggleMobileMenu()">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>

<nav id="mobileMenu">
  <ul id="mobileMenuList" style="list-style:none; padding:0;">
    <li class="nav-item"><a class="nav-link" href="/en/gallery.html">Gallery</a></li><li class="nav-item"><a class="nav-link" href="/en/events.html">Events</a></li><li class="nav-item"><a class="nav-link" href="/en/authors.html">Authors</a></li><li class="nav-item"><a class="nav-link" href="/en/writings.html">Writings</a></li><li class="nav-item"><a class="nav-link" href="/en/books.html">Books</a></li><li class="nav-item"><a class="nav-link" href="/en/index.html#about">About</a></li>
  </ul>
</nav>

<main id="content">
   <h1>Gallery</h1>
<p>Welcome to the Simeza Gallery. Explore our collection of fine paintings and photographic works.</p>
<div id="gallery-container" class="gallery-wrapper"></div>

<script>
// Detect language using the same logic as core/js/simeza.js
const languages = ['en', 'ro', 'de', 'es', 'fr', 'ru', 'pt', 'hu', 'it'];
const pathParts = window.location.pathname.split('/');
const urlLang = pathParts[1];
const lang = (urlLang && languages.includes(urlLang)) ? urlLang : (localStorage.getItem('lang') || 'en');

const manifestUrl = lang === 'en' ? '/files/gallery/manifest.json' : `/files/gallery/manifest_${lang}.json`;

fetch(manifestUrl)
    .then(response => {
        if (!response.ok) throw new Error('Manifest not found');
        return response.json();
    })
    .then(data => {
        const container = document.getElementById('gallery-container');
        data.forEach(item => {
            const panel = document.createElement('div');
            panel.className = 'gallery-panel';

            // Get content for the detected language, fallback to EN if missing
            const content = item.content[lang] || item.content['en'];

            panel.innerHTML = `
                <div class="gallery-image">
                    <img src="/files/gallery/${item.file}" alt="${content.name}">
                </div>
                <div class="gallery-data">
                    <h3>${content.name}</h3>
                    <p>${content.description}</p>
                    <p>Status: ${item.status}</p>
                    <p>Year: ${item.year}</p>
                </div>
            `;
            container.appendChild(panel);
        });
    })
    .catch(error => {
        console.error('Error loading gallery:', error);
        document.getElementById('gallery-container').innerHTML = '<p>Error loading gallery. Please try again later.</p>';
    });
</script>

<style>
.gallery-wrapper {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
    overflow: auto;
    scroll-snap-type: y mandatory;
    height: 80vh;
}

@media (min-width: 768px) {
    .gallery-wrapper {
        flex-direction: row;
        scroll-snap-type: x mandatory;
        overflow-x: auto;
    }
}

.gallery-panel {
    display: flex;
    flex-direction: column;
    scroll-snap-align: start;
    min-width: 100%;
    border: 1px solid #ccc;
    background: #fff;
    padding: 10px;
}

@media (min-width: 768px) {
    .gallery-panel {
        flex-direction: row;
        min-width: 80%;
    }
}

.gallery-image img {
    width: 100%;
    height: auto;
    max-height: 400px;
    object-fit: contain;
}

.gallery-data {
    padding: 20px;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 12px;
    height: 12px;
}
::-webkit-scrollbar-track {
    background: #f1f1f1;
}
::-webkit-scrollbar-thumb {
    background: #888;
}
::-webkit-scrollbar-thumb:hover {
    background: #555;
}
</style>
</main>

<footer id="socialFooter"></footer>
</div>

<script src="/core/js/simeza.js"></script>

</body>
</html>
